<!DOCTYPE html>
<html>
  <head>
    <title>AEM Assets Library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <!-- Import DA App SDK -->
    <script src="https://da.live/nx/utils/sdk.js" type="module"></script>
    <!-- Project App Logic -->
    <script src="/tools/asset-library/asset-library.js" type="module"></script>
    <!-- Adobe Styles -->
    <link rel="stylesheet" href="https://use.typekit.net/hah7vzn.css">
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        font-family: 'Adobe Clean', 'adobe-clean', sans-serif;
        margin: 0;
        padding: 12px;
        color: #222;
      }
      .al-toolbar {
        position: sticky;
        top: 0;
        background: #fff;
        padding-bottom: 10px;
        z-index: 1;
      }
      .al-search {
        width: 100%;
        padding: 8px 10px;
        font: inherit;
        border: 1px solid #c9c9c9;
        border-radius: 6px;
      }
      .al-status {
        font-size: 12px;
        color: #6d6d6d;
        margin: 8px 2px 0;
      }
      .al-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 10px;
      }
      .al-card {
        border: 1px solid #e4e4e4;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        background: #fafafa;
        transition: border-color .15s, box-shadow .15s;
        display: flex;
        flex-direction: column;
      }
      .al-card:hover, .al-card:focus-visible {
        border-color: #1473e6;
        box-shadow: 0 0 0 1px #1473e6;
        outline: none;
      }
      .al-thumb {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        background: #eee;
        display: block;
      }
      .al-thumb.is-broken {
        display: grid;
        place-items: center;
        font-size: 11px;
        color: #b33;
        padding: 6px;
        text-align: center;
      }
      .al-name {
        font-size: 11px;
        line-height: 1.3;
        padding: 6px 8px;
        word-break: break-word;
      }
      .al-empty {
        border: 1px dashed #c9c9c9;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        color: #6d6d6d;
        font-size: 13px;
        line-height: 1.5;
        margin-top: 12px;
      }
      .al-empty code {
        background: #f0f0f0;
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="al-toolbar">
      <input class="al-search" type="search" placeholder="Filter assets…" aria-label="Filter assets" />
      <div class="al-status" id="al-status">Loading assets…</div>
    </div>
    <div class="al-grid" id="al-grid"></div>
  </body>
</html>
